<script>
(function () {
  var container = document.getElementById('giscus-container');
  var html = document.documentElement;

  function currentGiscusTheme() {
    return html.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  }

  var script = document.createElement('script');
  script.src = 'https://giscus.app/client.js';
  script.setAttribute('data-repo', 'DeePunk42/DeePunk42.github.io');
  script.setAttribute('data-repo-id', 'R_kgDOJkjY4A');
  script.setAttribute('data-category', 'Announcements');
  script.setAttribute('data-category-id', 'DIC_kwDOJkjY4M4DEKmV');
  script.setAttribute('data-mapping', 'pathname');
  script.setAttribute('data-strict', '0');
  script.setAttribute('data-reactions-enabled', '1');
  script.setAttribute('data-emit-metadata', '0');
  script.setAttribute('data-input-position', 'bottom');
  script.setAttribute('data-theme', currentGiscusTheme());
  script.setAttribute('data-lang', 'zh-CN');
  script.setAttribute('data-loading', 'lazy');
  script.setAttribute('crossorigin', 'anonymous');
  script.async = true;
  container.appendChild(script);

  new MutationObserver(function () {
    var frame = document.querySelector('iframe.giscus-frame');
    if (!frame || !frame.contentWindow) return;

    frame.contentWindow.postMessage({
      giscus: {
        setConfig: {
          theme: currentGiscusTheme()
        }
      }
    }, 'https://giscus.app');
  }).observe(html, { attributes: true, attributeFilter: ['data-theme'] });
})();
</script>
